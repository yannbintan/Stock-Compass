name: Verify Stock Compass

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:worker
      - name: Prepare dependency archive for release verification
        run: tar -czf /tmp/stock-compass-dependencies.tgz node_modules package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: stock-compass-dependencies
          path: /tmp/stock-compass-dependencies.tgz
          retention-days: 1
          compression-level: 0
